name: Release DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-sign-release:
    name: Build, Sign & Notarize DMG
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile
        run: yarn compile

      - name: Build macOS arm64
        run: yarn gulp vscode-darwin-arm64

      - name: Find built app
        id: find-app
        run: |
          APP_PATH=$(find ../VSCode-darwin-arm64 -name "TARX*.app" -maxdepth 1 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "FATAL: Built app not found"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APP_PATH"

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Find identity
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Identity: $IDENTITY"

      - name: Sign application
        id: sign
        env:
          IDENTITY: ${{ steps.sign.outputs.identity || '' }}
        run: |
          APP_PATH="${{ steps.find-app.outputs.app_path }}"
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          ENT="$(pwd)/entitlements.plist"

          echo "Signing with: $IDENTITY"

          # Remove quarantine
          xattr -rc "$APP_PATH"

          # Sign dylibs
          find "$APP_PATH" -name '*.dylib' -print0 | while IFS= read -r -d '' file; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$file" 2>/dev/null || true
          done
          echo "  dylibs signed"

          # Sign .node native modules
          find "$APP_PATH" -name '*.node' -print0 | while IFS= read -r -d '' file; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$file" 2>/dev/null || true
          done
          echo "  .node modules signed"

          # Sign frameworks
          for fw in "$APP_PATH"/Contents/Frameworks/*.framework; do
            [ -d "$fw" ] && codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$fw" 2>/dev/null || true
          done
          echo "  frameworks signed"

          # Sign helper apps
          find "$APP_PATH" -name '*.app' -type d -not -samefile "$APP_PATH" -print0 | while IFS= read -r -d '' helper; do
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" --entitlements "$ENT" "$helper" 2>/dev/null || true
          done
          echo "  helper apps signed"

          # Sign main binary and app bundle
          codesign --force --options runtime --timestamp --sign "$IDENTITY" --entitlements "$ENT" "$APP_PATH/Contents/MacOS/Electron"
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" --entitlements "$ENT" "$APP_PATH"
          echo "  main app signed"

          # Verify
          codesign --verify --deep --strict "$APP_PATH"
          echo "  signature verified"

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ inputs.version }}"
          APP_PATH="${{ steps.find-app.outputs.app_path }}"
          DMG_NAME="TARX-Workbench-${VERSION}-arm64.dmg"

          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')

          hdiutil create \
            -volname "TARX Workbench" \
            -srcfolder "$(dirname "$APP_PATH")" \
            -ov -format UDZO \
            "$RUNNER_TEMP/$DMG_NAME"

          codesign --force --timestamp --sign "$IDENTITY" "$RUNNER_TEMP/$DMG_NAME"

          echo "dmg_path=$RUNNER_TEMP/$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "${{ steps.dmg.outputs.dmg_path }}" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "${{ steps.dmg.outputs.dmg_path }}"
          echo "  notarized and stapled"

      - name: Create GitHub Release
        run: |
          VERSION="${{ inputs.version }}"
          DMG_PATH="${{ steps.dmg.outputs.dmg_path }}"
          DMG_NAME="${{ steps.dmg.outputs.dmg_name }}"

          SHA=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')

          gh release create "v$VERSION" \
            "$DMG_PATH" \
            --title "TARX Workbench v$VERSION" \
            --notes "$(cat <<EOF
          ## TARX Workbench v$VERSION

          **Download:** \`$DMG_NAME\`
          **SHA256:** \`$SHA\`
          **Architecture:** Apple Silicon (arm64)
          **Signed:** Developer ID Application (notarized)

          ### Install
          1. Download the DMG
          2. Drag TARX Workbench to Applications
          3. Open from Applications (first launch may take a moment for Gatekeeper check)
          EOF
          )"

          echo "Release: https://github.com/tarx-ai/tarx-code-oss/releases/tag/v$VERSION"
          echo "SHA256: $SHA"
        env:
          GH_TOKEN: ${{ github.token }}
